[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-reason"
version = "0.1.1"
description = "Trace your AI agent's reasoning, not just its tool calls."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cyclopts>=4", "rich>=15"]

[project.scripts]
ghost-reason = "ghost_reason.cli:app"

